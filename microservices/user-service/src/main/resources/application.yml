server:
  port: 8081

spring:
  application:
    name: ${APP_NAME:user-service}
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:9000 # Auth-service's issuer URI
  datasource: # Assuming PostgreSQL, ensure these are appropriate or externalized
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Or 'validate' in prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${SHOW_SQL:false}
        format_sql: ${FORMAT_SQL:false}

logging:
  level:
    org.springframework.security: INFO # Default to INFO, can be TRACE for debugging
    dev.skyang: DEBUG

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka}
  instance:
    preferIpAddress: true
    # hostname: user-service

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    show-details: always