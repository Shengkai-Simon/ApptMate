version: '3.9'

services:
  config-service:
    build:
      context: .
      dockerfile: microservices/config-service/Dockerfile
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      APP_NAME: config-service
      SPRING_PROFILES_ACTIVE: native
    volumes:
      - ./config-repo:/config-repo
    networks:
      - backend

  discovery-service:
    build: ./microservices/discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      APP_NAME: discovery-service
      CONFIG_SERVER_URL: http://config-service:8888
    depends_on:
      - config-service
    networks:
      - backend

  api-gateway:
    build: ./microservices/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      APP_NAME: api-gateway
      CONFIG_SERVER_URL: http://config-service:8888
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

  auth-service:
    build: ./microservices/auth-service
    container_name: auth-service
    ports:
      - "9000:9000"
    environment:
      SERVER_PORT: 9000
      APP_NAME: auth-service
      CONFIG_SERVER_URL: http://config-service:8888
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

  user-service:
    build: ./microservices/user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081 # Port changed
      APP_NAME: user-service
      CONFIG_SERVER_URL: http://config-service:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME_USER: userdb # Changed from user_db
      DB_USERNAME_USER: user
      DB_PASSWORD_USER: pass
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

  booking-service:
    build: ./microservices/booking-service
    container_name: booking-service
    ports:
      - "9200:9200"
    environment:
      SERVER_PORT: 9200
      APP_NAME: booking-service
      CONFIG_SERVER_URL: http://config-service:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME_BOOKING: bookingdb # Changed from booking_db
      DB_USERNAME_BOOKING: user
      DB_PASSWORD_BOOKING: pass
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

  availability-service:
    build: ./microservices/availability-service
    container_name: availability-service
    ports:
      - "9300:9300"
    environment:
      SERVER_PORT: 9300
      APP_NAME: availability-service
      CONFIG_SERVER_URL: http://config-service:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME_AVAILABILITY: availabilitydb # Changed from availability_db
      DB_USERNAME_AVAILABILITY: user
      DB_PASSWORD_AVAILABILITY: pass
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

  notification-service:
    build: ./microservices/notification-service
    container_name: notification-service
    ports:
      - "9400:9400"
    environment:
      SERVER_PORT: 9400
      APP_NAME: notification-service
      CONFIG_SERVER_URL: http://config-service:8888
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

  reporting-service:
    build: ./microservices/reporting-service
    container_name: reporting-service
    ports:
      - "9500:9500"
    environment:
      SERVER_PORT: 9500
      APP_NAME: reporting-service
      CONFIG_SERVER_URL: http://config-service:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME_REPORTING: reportingdb # Changed from reporting_db
      DB_USERNAME_REPORTING: user
      DB_PASSWORD_REPORTING: pass
    depends_on:
      - config-service
      - discovery-service
    networks:
      - backend

networks:
  backend:
    driver: bridge