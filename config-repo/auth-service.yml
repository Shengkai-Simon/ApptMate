server:
  port: 9000
spring:
  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registrationId: oidc-client
            client-id: "oidc-client"
            client-secret: "{noop}secret" # Keep {noop} for now, consider bcrypt for secrets in prod
            client-authentication-methods:
              - "client_secret_basic"
              - "client_secret_post" # Added this line
            authorization-grant-types:
              - "authorization_code"
              - "refresh_token"
              - "client_credentials"
              - "password"
            redirect-uris:
              - "http://127.0.0.1:8080/login/oauth2/code/oidc-client" # Example for a local client
              - "http://appt-bff-gateway:3000/login/callback" # Example for BFF if it has a callback
            scopes:
              - "openid"
              - "profile"
              - "api.read" # Added example scope
            client-settings:
              require-proof-key: false # Simplified for some clients, true is better for public clients
              require-authorization-consent: true
        issuer: http://auth-service:9000 # Internal issuer URI using service name
  # Datasource configuration for auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME_AUTH:authdb}
    username: ${DB_USERNAME_AUTH:user}
    password: ${DB_PASSWORD_AUTH:pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Or 'validate' in prod. Use 'update' for now.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${SHOW_SQL:false} # Add if debugging SQL is needed
        format_sql: ${FORMAT_SQL:false}
user:
  service:
    base:
      url: http://user-service:8081 # Internal URL using service name
# Ensure spring.application.name=auth-service is set in bootstrap.yml of the service
