server:
  port: 8081
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:9000 # Service name for internal communication
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgresql_db}:${DB_PORT:5432}/${DB_NAME_USER:userdb} # Changed from user_db to userdb
    username: ${DB_USERNAME_USER:user}
    password: ${DB_PASSWORD_USER:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Or 'validate' in prod, 'create-drop' for dev/test sometimes
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${SHOW_SQL:false}
        format_sql: ${FORMAT_SQL:false}
# Ensure spring.application.name=user-service is set in bootstrap.yml of the service
