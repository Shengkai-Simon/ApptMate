server:
  port: 9200 # Default, will be overridden by Docker Compose if needed
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME_BOOKING:bookingdb}
    username: ${DB_USERNAME_BOOKING:user}
    password: ${DB_PASSWORD_BOOKING:pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Or 'validate' in prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
